<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Vistara Admin — Platform Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8f9fb;
            --surface: #ffffff;
            --card: #ffffff;
            --border: #e2e6ed;
            --text: #1a1d23;
            --muted: #6b7280;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #059669;
            --danger: #dc2626;
            --radius: 8px;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; min-height: 100vh; line-height: 1.6; }
        .topnav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 32px; height: 56px; display: flex; align-items: center; gap: 32px; position: sticky; top: 0; z-index: 50; box-shadow: var(--shadow); }
        .nav-brand { font-size: 18px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .nav-brand span { color: var(--text); font-weight: 400; font-size: 13px; }
        .nav-links { display: flex; gap: 4px; flex: 1; }
        .nav-link { padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); border: none; background: none; transition: all 0.15s; font-family: 'Inter', sans-serif; }
        .nav-link:hover { background: var(--bg); color: var(--text); }
        .nav-link.active { background: #eff6ff; color: var(--accent); font-weight: 600; }
        .nav-user { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
        .nav-user .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
        .main { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow); }
        .card-header { font-size: 16px; font-weight: 600; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); text-align: center; }
        .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--text); margin-top: 6px; }
        .stat-value.accent { color: var(--accent); }
        .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
        .form-group { flex: 1; min-width: 180px; margin-bottom: 14px; }
        .form-label { display: block; font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 5px; }
        .form-input, .form-select { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 9px 12px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px; outline: none; transition: border-color 0.15s; }
        .form-input:focus, .form-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .btn { padding: 9px 16px; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--accent); color: #fff; font-weight: 600; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .btn-outline:hover { background: var(--bg); border-color: #cbd5e1; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 10px 14px; border-bottom: 2px solid var(--border); color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
        td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text); }
        tr:hover td { background: #f8fafc; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
        .badge-blue { background: #eff6ff; color: #2563eb; }
        .badge-green { background: #ecfdf5; color: #059669; }
        .badge-red { background: #fef2f2; color: #dc2626; }
        .license-display { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: var(--radius); padding: 16px; margin-top: 16px; display: none; }
        .license-display.show { display: block; }
        .license-key { font-family: 'SF Mono', 'Consolas', monospace; font-size: 18px; font-weight: 600; color: #0369a1; letter-spacing: 0.5px; word-break: break-all; background: #fff; padding: 10px 14px; border-radius: 6px; border: 1px solid #e0f2fe; margin: 8px 0; }
        .toast { position: fixed; bottom: 24px; right: 24px; background: var(--text); color: #fff; border-radius: 8px; padding: 12px 18px; z-index: 9999; transform: translateY(80px); opacity: 0; transition: all 0.3s ease; font-size: 13px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: #059669; }
        .toast.error { background: #dc2626; }
        @media (max-width: 768px) { .topnav { padding: 0 16px; gap: 12px; } .nav-link { padding: 8px 10px; font-size: 11px; } .stats-row { grid-template-columns: repeat(2, 1fr); } .form-row { flex-direction: column; } .main { padding: 20px 12px; } }
    </style>
</head>
<body>

    <nav class="topnav">
        <div class="nav-brand">Vistara <span>| Admin Console</span></div>
        <div class="nav-links">
            <button class="nav-link active" onclick="switchTab('licenses')">🔑 Generate License</button>
            <button class="nav-link" onclick="switchTab('all-licenses')">📋 All Licenses</button>
            <button class="nav-link" onclick="switchTab('businesses')">🏢 Businesses</button>
            <button class="nav-link" onclick="switchTab('revenue')">💰 Revenue</button>
        </div>
        <div class="nav-user"><span class="dot"></span> Administrator</div>
    </nav>

    <div class="main">

        <!-- GENERATE LICENSE -->
        <div id="page-licenses" class="page active">
            <div class="card">
                <div class="card-header">Generate New License Key</div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Business Name *</label>
                        <input class="form-input" id="lic-name" placeholder="e.g., Al Maha Trading Co.">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Plan *</label>
                        <select class="form-select" id="lic-plan">
                            <option value="Starter">Starter — AED 99/mo (10 items)</option>
                            <option value="Growth" selected>Growth — AED 275/mo (50 items)</option>
                            <option value="Pro">Pro — AED 699/mo (200 items)</option>
                            <option value="Enterprise">Enterprise — AED 1,799/mo (Unlimited)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Validity Period</label>
                        <select class="form-select" id="lic-expiry">
                            <option value="14">14 Days (Trial)</option>
                            <option value="30">30 Days</option>
                            <option value="90">90 Days</option>
                            <option value="365" selected>1 Year</option>
                            <option value="0">Lifetime</option>
                        </select>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="generateLicense()">🔑 Generate License Key</button>
                <div class="license-display" id="generated-license">
                    <div style="font-weight:600;color:#0369a1;margin-bottom:4px;">✅ License Generated Successfully</div>
                    <div class="license-key" id="license-key-text"></div>
                    <div style="font-size:12px;color:#64748b;margin-bottom:10px;">Provide this key to your client. They enter it during signup.</div>
                    <button class="btn btn-outline btn-sm" onclick="copyLicense()">📋 Copy to Clipboard</button>
                </div>
            </div>
        </div>

        <!-- ALL LICENSES -->
        <div id="page-all-licenses" class="page">
            <div class="card">
                <div class="card-header">Issued License Keys</div>
                <div id="all-licenses-list" style="color:var(--muted);text-align:center;padding:30px;">Loading data...</div>
            </div>
        </div>

        <!-- BUSINESSES -->
        <div id="page-businesses" class="page">
            <div class="card">
                <div class="card-header">Registered Businesses</div>
                <div id="businesses-list" style="color:var(--muted);text-align:center;padding:30px;">Loading data...</div>
            </div>
        </div>

        <!-- REVENUE -->
        <div id="page-revenue" class="page">
            <div class="stats-row" id="revenue-stats"></div>
            <div class="card">
                <div class="card-header">Monthly Revenue Breakdown</div>
                <div id="revenue-breakdown" style="color:var(--muted);text-align:center;padding:30px;">Loading data...</div>
            </div>
        </div>

    </div>

    <div class="toast" id="toast"></div>

    <script>
    var API_URL = 'https://script.google.com/macros/s/AKfycbxmbOEKhMFd5vMJn2X8VT4YzNQxrHweb2Udb1V8qyZ95N1vrDqRBxgmrAqtS503637K5g/exec';
    var ADMIN_KEY = sessionStorage.getItem('vistara_admin_key') || 'vistara-admin-2024-secure-key-change-this';
    var AED_PRICES = { 'Starter': 99, 'Growth': 275, 'Pro': 699, 'Enterprise': 1799 };

async function api(action, payload) {
    if (!ADMIN_KEY) {
        ADMIN_KEY = prompt('Enter admin API key:');
        if (!ADMIN_KEY) return { error: 'Admin key required' };
        sessionStorage.setItem('vistara_admin_key', ADMIN_KEY);
    }
    try {
        var body = new URLSearchParams();
        body.append('data', JSON.stringify({ action: action, payload: Object.assign({}, payload, { adminKey: ADMIN_KEY }) }));
        
        var response = await fetch(API_URL, { method: 'POST', body: body });
        var text = await response.text();
        
        // HtmlService wraps response in HTML, extract the JSON
        // Try parsing directly first
        try {
            return JSON.parse(text);
        } catch(e) {
            // If wrapped in HTML, extract from body
            var match = text.match(/<body[^>]*>([\s\S]*)<\/body>/i);
            if (match && match[1]) {
                return JSON.parse(match[1]);
            }
            return { error: 'Invalid response from server' };
        }
    } catch(e) {
        console.error(e);
        return { error: 'Network error: ' + e.message };
    }
}        
    function switchTab(tab) {
        document.querySelectorAll('.nav-link').forEach(function(n) { n.classList.remove('active'); });
        document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
        var btn = document.querySelector('.nav-link[onclick*="' + tab + '"]');
        if (btn) btn.classList.add('active');
        document.getElementById('page-' + tab).classList.add('active');
        if (tab === 'all-licenses') loadAllLicenses();
        if (tab === 'businesses') loadBusinesses();
        if (tab === 'revenue') loadRevenue();
    }

    async function generateLicense() {
        var name = document.getElementById('lic-name').value.trim();
        if (!name || name.length < 2) { showToast('Please enter a valid business name', 'error'); return; }
        var plan = document.getElementById('lic-plan').value;
        var price = AED_PRICES[plan] || 0;
        var result = await api('adminGenerateLicense', { businessName: name, plan: plan, expiryDays: parseInt(document.getElementById('lic-expiry').value) });
        if (result.success) {
            document.getElementById('license-key-text').textContent = result.licenseKey;
            document.getElementById('generated-license').classList.add('show');
            document.getElementById('lic-name').value = '';
            showToast('License generated! ' + plan + ' Plan - AED ' + price + '/mo', 'success');
        } else { showToast(result.error || 'Failed', 'error'); }
    }

    function copyLicense() {
        var key = document.getElementById('license-key-text').textContent;
        if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(key).then(function() { showToast('Copied!', 'success'); }); }
        else { var t = document.createElement('textarea'); t.value = key; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); showToast('Copied!', 'success'); }
    }

    async function loadAllLicenses() {
        document.getElementById('all-licenses-list').innerHTML = '<p style="padding:30px;">Loading...</p>';
        var result = await api('adminGetBusinesses');
        var c = document.getElementById('all-licenses-list');
        if (!result.businesses || !result.businesses.length) { c.innerHTML = '<p style="padding:30px;">No licenses yet.</p>'; return; }
        var h = '<div class="table-wrap"><table><thead><tr><th>Business</th><th>Plan</th><th>Price</th><th>License Key</th><th>Status</th></tr></thead><tbody>';
        result.businesses.forEach(function(b) {
            var p = AED_PRICES[b.plan] || 0;
            h += '<tr><td style="font-weight:500;">' + esc(b.name) + '</td><td><span class="badge badge-blue">' + (b.plan||'N/A') + '</span></td><td style="font-weight:600;color:var(--accent);">AED ' + p + '/mo</td><td style="font-family:monospace;font-size:10px;">' + (b.licenseKey?b.licenseKey.substring(0,18)+'...':'N/A') + '</td><td>' + (b.status==='active'?'<span class="badge badge-green">Active</span>':'<span class="badge badge-red">'+(b.status||'Unknown')+'</span>') + '</td></tr>';
        });
        h += '</tbody></table></div>';
        c.innerHTML = h;
    }

    async function loadBusinesses() {
        document.getElementById('businesses-list').innerHTML = '<p style="padding:30px;">Loading...</p>';
        var result = await api('adminGetBusinesses');
        var c = document.getElementById('businesses-list');
        if (!result.businesses || !result.businesses.length) { c.innerHTML = '<p style="padding:30px;">No businesses yet.</p>'; return; }
        var h = '<div class="table-wrap"><table><thead><tr><th>Business</th><th>Plan</th><th>Price</th><th>Email</th><th>Items</th><th>Status</th></tr></thead><tbody>';
        result.businesses.forEach(function(b) {
            var p = AED_PRICES[b.plan] || 0;
            h += '<tr><td style="font-weight:500;">' + esc(b.name) + '</td><td>' + (b.plan||'N/A') + '</td><td style="font-weight:600;color:var(--accent);">AED ' + p + '/mo</td><td style="font-size:12px;">' + esc(b.email) + '</td><td style="text-align:center;">' + (b.itemCount||0) + '</td><td>' + (b.status==='active'?'<span class="badge badge-green">Active</span>':'<span class="badge badge-red">'+(b.status||'Unknown')+'</span>') + '</td></tr>';
        });
        h += '</tbody></table></div>';
        c.innerHTML = h;
    }

    async function loadRevenue() {
        var result = await api('adminGetRevenue');
        var m = result.mrr || 0;
        var a = result.arr || 0;
        document.getElementById('revenue-stats').innerHTML = '<div class="stat-card"><div class="stat-label">Monthly Revenue</div><div class="stat-value accent">AED ' + m.toLocaleString() + '</div></div><div class="stat-card"><div class="stat-label">Annual Run Rate</div><div class="stat-value">AED ' + a.toLocaleString() + '</div></div><div class="stat-card"><div class="stat-label">Active Businesses</div><div class="stat-value">' + (result.activeBusinesses||0) + '</div></div><div class="stat-card"><div class="stat-label">5-Year Value</div><div class="stat-value" style="color:var(--accent);">AED ' + (m*60).toLocaleString() + '</div></div>';
        var bd = document.getElementById('revenue-breakdown');
        if (!result.breakdown || !result.breakdown.length) { bd.innerHTML = '<p style="padding:30px;">No active subscriptions yet.</p>'; return; }
        var h = '<div class="table-wrap"><table><thead><tr><th>Business</th><th>Plan</th><th>Monthly (AED)</th><th>Annual (AED)</th></tr></thead><tbody>';
        result.breakdown.forEach(function(b) { var p = AED_PRICES[b.plan]||0; h += '<tr><td style="font-weight:500;">' + esc(b.name) + '</td><td>' + (b.plan||'N/A') + '</td><td style="font-weight:600;color:var(--accent);">AED ' + p + '</td><td>AED ' + (p*12).toLocaleString() + '</td></tr>'; });
        h += '<tr style="font-weight:700;border-top:2px solid var(--border);background:#f8fafc;"><td colspan="2">Total MRR</td><td style="color:var(--accent);">AED ' + m.toLocaleString() + '</td><td>AED ' + a.toLocaleString() + '</td></tr></tbody></table></div>';
        bd.innerHTML = h;
    }

    function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    function showToast(msg, type) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast ' + (type||'') + ' show';
        clearTimeout(t._t);
        t._t = setTimeout(function() { t.classList.remove('show'); }, 3000);
    }

    if (!ADMIN_KEY || ADMIN_KEY === 'vistara-admin-2024-secure-key-change-this') {
        setTimeout(function() {
            var k = prompt('Enter admin API key (press OK for default):');
            if (k) { ADMIN_KEY = k; sessionStorage.setItem('vistara_admin_key', k); }
        }, 500);
    }
    </script>
</body>
</html>
