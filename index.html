<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistara — Business Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg: #f0f2f5; --surface: #ffffff; --border: #dde1e6; --text: #1a1d23; --muted: #6b7280; --accent: #2563eb; --accent-hover: #1d4ed8; --success: #059669; --danger: #dc2626; --radius: 8px; --shadow: 0 1px 3px rgba(0,0,0,0.06); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .auth-wrapper { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
        .auth-card { background: var(--surface); border-radius: 12px; padding: 40px; width: 440px; max-width: 95vw; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
        .auth-logo { font-size: 24px; font-weight: 700; color: var(--accent); text-align: center; }
        .auth-subtitle { color: var(--muted); font-size: 13px; text-align: center; margin-bottom: 32px; }
        .app-container { display: none; }
        .app-container.active { display: flex; }
        .sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); min-height: 100vh; position: fixed; left: 0; top: 0; bottom: 0; z-index: 50; display: flex; flex-direction: column; }
        .sidebar-brand { padding: 24px 20px; border-bottom: 1px solid var(--border); font-size: 18px; font-weight: 700; color: var(--accent); }
        .sidebar-business { padding: 16px 20px; border-bottom: 1px solid var(--border); }
        .sidebar-biz-name { font-weight: 600; font-size: 14px; }
        .sidebar-biz-plan { font-size: 11px; color: var(--muted); }
        .sidebar-nav { flex: 1; padding: 12px 8px; }
        .sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); text-decoration: none; margin-bottom: 2px; }
        .sidebar-nav a:hover { background: #f0f2f5; color: var(--text); }
        .sidebar-nav a.active { background: #eff6ff; color: var(--accent); font-weight: 600; }
        .sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--border); }
        .main-content { margin-left: 240px; flex: 1; }
        .topbar { height: 56px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; box-shadow: var(--shadow); position: sticky; top: 0; }
        .topbar-title { font-size: 16px; font-weight: 600; flex: 1; }
        .content-area { padding: 24px; }
        .page { display: none; }
        .page.active { display: block; }
        .btn { padding: 9px 16px; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 13px; cursor: pointer; border: 1px solid transparent; }
        .btn-primary { background: var(--accent); color: #fff; font-weight: 600; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-outline { background: transparent; border-color: var(--border); color: var(--text); }
        .btn-danger { background: transparent; border-color: #fecaca; color: var(--danger); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow); }
        .card-header { font-size: 16px; font-weight: 600; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 5px; }
        .form-input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 13px; outline: none; }
        .form-input:focus { border-color: var(--accent); }
        .qr-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; text-align: center; }
        .inline-code { background: #f1f5f9; border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; font-family: 'SF Mono', 'Consolas', monospace; font-size: 12px; color: var(--accent); word-break: break-all; }
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
        .item-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
        .item-preview { height: 160px; display: flex; align-items: center; justify-content: center; background: #f1f5f9; font-size: 48px; color: var(--muted); }
        .item-body { padding: 14px; }
        .item-name { font-weight: 600; font-size: 14px; }
        .item-price { font-size: 18px; font-weight: 700; color: var(--accent); margin-top: 4px; }
        .item-actions { display: flex; gap: 8px; margin-top: 10px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px; }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--surface); border-radius: 12px; width: 480px; max-width: 95vw; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .modal-header { padding: 20px 24px 0; display: flex; justify-content: space-between; align-items: center; }
        .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--muted); }
        .modal-body { padding: 20px 24px 24px; }
        .toast { position: fixed; bottom: 24px; right: 24px; background: #1a1d23; color: #fff; border-radius: 8px; padding: 12px 20px; z-index: 9999; transform: translateY(80px); opacity: 0; transition: all 0.3s ease; font-size: 13px; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.error { background: var(--danger); }
        .toast.success { background: var(--success); }
        .empty-state { text-align: center; padding: 48px 20px; color: var(--muted); }
        @media (max-width: 768px) { .sidebar { width: 60px; } .sidebar-brand, .sidebar-biz-name, .sidebar-biz-plan, .sidebar-nav a span:last-child { display: none; } .main-content { margin-left: 60px; } }
    </style>
</head>
<body>
    <div id="loginScreen" class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">Vistara</div>
            <div class="auth-subtitle">Sign in to manage your 3D catalog</div>
            <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" id="loginEmail" placeholder="you@company.com"></div>
            <div class="form-group"><label class="form-label">Password</label><input class="form-input" type="password" id="loginPassword" placeholder="Your password"></div>
            <button class="btn btn-primary" style="width:100%;padding:12px;" onclick="handleLogin()">🔐 Sign In</button>
            <p style="text-align:center;margin-top:16px;font-size:12px;color:var(--muted);">New? <a href="#" onclick="showSignup()" style="color:var(--accent);">Create account with license key</a></p>
        </div>
    </div>
    <div id="signupScreen" class="auth-wrapper" style="display:none;">
        <div class="auth-card">
            <div class="auth-logo">Create Account</div>
            <div class="auth-subtitle">Enter your license key to start</div>
            <div class="form-group"><label class="form-label">License Key</label><input class="form-input" id="signupLicense" placeholder="VIST-XXXX-XXXX-XXXX"></div>
            <div class="form-group"><label class="form-label">Business Name</label><input class="form-input" id="signupName"></div>
            <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" id="signupEmail"></div>
            <div class="form-group"><label class="form-label">Password (min 8 chars)</label><input class="form-input" type="password" id="signupPassword"></div>
            <button class="btn btn-primary" style="width:100%;padding:12px;" onclick="handleSignup()">✨ Create Account</button>
            <p style="text-align:center;margin-top:16px;"><a href="#" onclick="showLogin()" style="color:var(--accent);">← Back</a></p>
        </div>
    </div>
    <div id="appContainer" class="app-container">
        <aside class="sidebar">
            <div class="sidebar-brand">Vistara</div>
            <div class="sidebar-business"><div class="sidebar-biz-name" id="sidebarBizName">Business</div><div class="sidebar-biz-plan" id="sidebarBizPlan">Plan</div></div>
            <nav class="sidebar-nav" id="sidebarNav">
                <a class="active" data-page="dashboard">📊 Dashboard</a>
                <a data-page="items">📦 My Items</a>
                <a data-page="qrcode">🔗 QR Code</a>
                <a data-page="settings">⚙️ Settings</a>
            </nav>
            <div class="sidebar-footer"><button class="btn btn-outline btn-sm" style="width:100%;" onclick="handleLogout()">🚪 Sign Out</button></div>
        </aside>
        <main class="main-content">
            <div class="topbar"><div class="topbar-title" id="topbarTitle">Dashboard</div><button class="btn btn-primary btn-sm" onclick="openAddItem()">+ Add Item</button></div>
            <div class="content-area" id="contentArea"></div>
        </main>
    </div>
    <div class="toast" id="toast"></div>
    <script>
        var API_URL = 'https://script.google.com/macros/s/AKfycbyhRyUXpBsGX0YdV61gT-IyEsZSlGj4MIYsTbsifhpd-FI8zRjcBPljuHMAAw4C4KXo/exec';
        var token = localStorage.getItem('vtoken') || '';
        var business = null;
        try { business = JSON.parse(localStorage.getItem('vbiz') || 'null'); } catch(e) { business = null; }

        async function api(action, payload) {
            var body = new URLSearchParams();
            body.append('data', JSON.stringify({ action: action, payload: payload, token: token }));
            try { var r = await fetch(API_URL, { method: 'POST', body: body }); return await r.json(); } catch(e) { return { error: 'Network error' }; }
        }

        function showSignup() { document.getElementById('loginScreen').style.display = 'none'; document.getElementById('signupScreen').style.display = 'flex'; }
        function showLogin() { document.getElementById('signupScreen').style.display = 'none'; document.getElementById('loginScreen').style.display = 'flex'; }

        async function handleLogin() {
            var email = document.getElementById('loginEmail').value.trim();
            var pass = document.getElementById('loginPassword').value;
            if (!email || !pass) return showToast('Fill all fields', 'error');
            var res = await api('businessLogin', { email: email, password: pass });
            if (res.success) { token = res.token; business = res.business; localStorage.setItem('vtoken', token); localStorage.setItem('vbiz', JSON.stringify(business)); showApp(); showToast('Welcome, ' + business.name + '!', 'success'); }
            else showToast(res.error || 'Login failed', 'error');
        }

        async function handleSignup() {
            var lic = document.getElementById('signupLicense').value.trim();
            var name = document.getElementById('signupName').value.trim();
            var email = document.getElementById('signupEmail').value.trim();
            var pass = document.getElementById('signupPassword').value;
            if (!lic || !name || !email || !pass) return showToast('All fields required', 'error');
            if (pass.length < 8) return showToast('Password must be 8+ characters', 'error');
            var res = await api('businessSignup', { licenseKey: lic, name: name, email: email, password: pass });
            if (res.success) { token = res.token; business = res.business; localStorage.setItem('vtoken', token); localStorage.setItem('vbiz', JSON.stringify(business)); showApp(); showToast('Account created!', 'success'); }
            else showToast(res.error || 'Signup failed', 'error');
        }

        function handleLogout() { token = ''; business = null; localStorage.removeItem('vtoken'); localStorage.removeItem('vbiz'); document.getElementById('appContainer').classList.remove('active'); document.getElementById('loginScreen').style.display = 'flex'; }

        function showApp() {
            document.getElementById('loginScreen').style.display = 'none'; document.getElementById('signupScreen').style.display = 'none';
            document.getElementById('appContainer').classList.add('active');
            document.getElementById('sidebarBizName').textContent = business.name;
            document.getElementById('sidebarBizPlan').textContent = (business.plan || 'Starter') + ' Plan';
            document.querySelectorAll('#sidebarNav a').forEach(function(a) { a.addEventListener('click', function(e) { e.preventDefault(); document.querySelectorAll('#sidebarNav a').forEach(function(l) { l.classList.remove('active'); }); a.classList.add('active'); renderPage(a.dataset.page); }); });
            renderPage('dashboard');
        }

        function renderPage(page) {
            document.getElementById('topbarTitle').textContent = page.charAt(0).toUpperCase() + page.slice(1);
            var c = document.getElementById('contentArea');
            if (page === 'dashboard') { var u = location.origin + location.pathname.replace('index.html','') + 'catalog.html?biz=' + business.id; c.innerHTML = '<div class="card"><div class="card-header">📋 Your Catalog URL</div><span class="inline-code" style="display:block;padding:14px;">' + u + '</span></div>'; }
            else if (page === 'items') loadItems(c);
            else if (page === 'qrcode') { var q = location.origin + location.pathname.replace('index.html','') + 'catalog.html?biz=' + business.id; c.innerHTML = '<div class="card"><div class="card-header">🔗 Your QR Code</div><div class="qr-card"><div id="qrDisplay" style="display:inline-block;background:#fff;padding:16px;border-radius:8px;"></div><p style="margin-top:8px;font-size:11px;">' + q + '</p><button class="btn btn-primary btn-sm" onclick="downloadQR()">⬇ Download</button></div></div>'; setTimeout(function() { var qc = document.getElementById('qrDisplay'); if(qc){qc.innerHTML='';new QRCode(qc,{text:q,width:200,height:200,colorDark:'#000',colorLight:'#fff'});} }, 200); }
            else if (page === 'settings') c.innerHTML = '<div class="card"><div class="card-header">Settings</div><div class="form-group"><label class="form-label">Business Name</label><input class="form-input" id="settingsName" value="' + esc(business.name) + '"></div><button class="btn btn-primary" onclick="saveSettings()">💾 Save</button></div>';
        }

        async function loadItems(c) {
            var res = await api('getItems'); var items = res.items || [];
            if (!items.length) { c.innerHTML = '<div class="card"><div class="card-header">My Items</div><div class="empty-state"><p>No items yet.</p><button class="btn btn-primary" onclick="openAddItem()">+ Add Item</button></div></div>'; return; }
            var h = '<div class="card"><div class="card-header">My Items</div><div class="items-grid">';
            items.forEach(function(i) { h += '<div class="item-card"><div class="item-preview">📦</div><div class="item-body"><div class="item-name">' + esc(i.name) + '</div><div class="item-price">' + esc(i.price) + '</div><div class="item-actions"><button class="btn btn-danger btn-sm" onclick="deleteItem(\'' + i.id + '\')">✕</button></div></div></div>'; });
            h += '</div></div>'; c.innerHTML = h;
        }

        function openAddItem() { var n = prompt('Product name:'); var p = prompt('Price:'); if (n && p) { api('addItem', { name: n, price: p }).then(function(r) { if (r.success) { loadItems(document.getElementById('contentArea')); showToast('Item added', 'success'); } }); } }
        function deleteItem(id) { if (confirm('Delete?')) { api('deleteItem', { itemId: id }).then(function() { loadItems(document.getElementById('contentArea')); }); } }
        async function saveSettings() { var n = document.getElementById('settingsName').value.trim(); if (!n) return; await api('updateSettings', { name: n }); business.name = n; localStorage.setItem('vbiz', JSON.stringify(business)); document.getElementById('sidebarBizName').textContent = n; showToast('Saved', 'success'); }
        function downloadQR() { var c = document.querySelector('#qrDisplay canvas'); if (c) { var a = document.createElement('a'); a.download = 'qr.png'; a.href = c.toDataURL(); a.click(); } }
        function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function showToast(m, t) { var o = document.getElementById('toast'); o.textContent = m; o.className = 'toast ' + (t||'') + ' show'; clearTimeout(o._t); o._t = setTimeout(function() { o.classList.remove('show'); }, 3000); }
        if (token && business) { api('getProfile').then(function(r) { if (r.business) { business = r.business; showApp(); } else handleLogout(); }); }
    </script>
</body>
</html>
